name: Website checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: ${{ runner.temp }}
      NODE_PATH: ${{ runner.temp }}/site-browser/node_modules
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/site-browsers
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install check dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          npm install --prefix "$RUNNER_TEMP/site-browser" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/site-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          for source in js/*.js tests/*.cjs scripts/*.cjs; do node --check "$source"; done
          node --check < scripts/contact-form.gs
      - name: Check contact backend and shared browser logic
        run: node --test scripts/site-regression.test.cjs tests/*.test.cjs
      - name: Check publication pipeline, local links, and metadata
        run: |
          python scripts/check-site.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check desktop and mobile browser behavior
        run: node tests/browser-smoke.cjs
